name: Daily Current Affairs Post

on:
  schedule:
    # 7:00 AM IST = 01:30 UTC
    - cron: "30 1 * * *"

  # Allow manual trigger from GitHub Actions tab
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (generate image but do NOT post to Instagram)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  post-current-affairs:
    name: Generate & Post Daily Current Affairs
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # ── 1. Checkout repo ──────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Set up Python ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      # ── 3. Install system fonts (for Pillow emoji/unicode support) ────────
      - name: Install system dependencies
        run: |
          sudo apt-get update -q
          sudo apt-get install -y fonts-noto fonts-noto-color-emoji

      # ── 4. Install Python dependencies ────────────────────────────────────
      - name: Install Python dependencies
        run: pip install -r requirements.txt

      # ── 5. Download NotoSans fonts into assets/fonts/ ─────────────────────
      - name: Download NotoSans fonts
        run: |
          mkdir -p assets/fonts
          # NotoSans Bold
          curl -sSL -o assets/fonts/NotoSans-Bold.ttf \
            "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Bold.ttf"
          # NotoSans Regular
          curl -sSL -o assets/fonts/NotoSans-Regular.ttf \
            "https://github.com/notofonts/noto-fonts/raw/main/hinted/ttf/NotoSans/NotoSans-Regular.ttf"

      # ── 6. Create data directory (for SQLite DB) ──────────────────────────
      - name: Prepare data directory
        run: mkdir -p data output

      # ── 7. Restore SQLite DB cache (avoid reposting seen articles) ────────
      - name: Restore article DB cache
        uses: actions/cache@v4
        with:
          path: data/processed_articles.db
          key: article-db-${{ runner.os }}
          restore-keys: article-db-

      # ── 8. Run the pipeline ───────────────────────────────────────────────
      - name: Run Current Affairs pipeline
        env:
          GROQ_API_KEY:                     ${{ secrets.GROQ_API_KEY }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID:    ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
          INSTAGRAM_ACCESS_TOKEN:           ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          GITHUB_TOKEN:                     ${{ secrets.GH_IMAGE_TOKEN }}
          GITHUB_IMAGE_REPO:                ${{ secrets.GITHUB_IMAGE_REPO }}
          GITHUB_IMAGE_BRANCH:              main
          INSTAGRAM_HANDLE:                 ${{ secrets.INSTAGRAM_HANDLE }}
          NEWSAPI_KEY:                      ${{ secrets.NEWSAPI_KEY }}
        run: |
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            python src/main.py --dry-run
          else
            python src/main.py
          fi

      # ── 9. Upload generated image as artifact (visible in Actions tab) ────
      - name: Upload image artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: daily-post-${{ github.run_id }}
          path: output/
          retention-days: 7

      # ── 10. Save updated SQLite DB cache ─────────────────────────────────
      - name: Save article DB cache
        if: always()
        uses: actions/cache@v4
        with:
          path: data/processed_articles.db
          key: article-db-${{ runner.os }}-${{ github.run_id }}
